[opencode.tiers.sol]
model = "openai/gpt-6.1-sol"

[opencode.roles]
# `tier` = GPT lane, `free_tier` = Free lane. Same `effort` in both lanes.
worker    = { work = "Mechanical extraction, scoped lookup, classification", agent = ["chuck-worker", "explore", "general"], tier = "luna", free_tier = "free_small", effort = "low" }
implement = { work = "Clear implementation, scripts, docs, subsystem explanation", agent = ["chuck-artisan", "general"], tier = "sol", free_tier = "free", effort = "medium" }
hard      = { work = "Tricky invariants, security, concurrency, crypto", agent = ["chuck-artisan", "general"], tier = "sol", free_tier = "free_hard", effort = "high" }
review    = { work = "Independent review (general only with an explicit read-only brief)", agent = ["chuck-reviewer", "general"], tier = "sol", free_tier = "free_hard", effort = "high" }
design    = { work = "Ambiguous debugging, design, failed high-effort work", agent = ["general"], tier = "sol", free_tier = "free_hard", effort = "xhigh" }
free      = { work = "Optional checkable, non-sensitive read-only units", agent = ["chuck-free", "explore"], tier = "free_small", free_tier = "free_small", effort = "low" }

# ------------------------------------------------------------------- Profiles
# Which role supplies the default model/effort written into each bundled agent
# file by scripts/sync-models.py. Per-call values still win at dispatch time.
[profiles]
"agents/claude/worker-bee.md"      = "claude.fanout"
"agents/claude/artisan.md"         = "claude.implement"
"agents/claude/reviewer.md"        = "claude.review"
"agents/opencode/chuck-worker.md"   = "opencode.worker"
"agents/opencode/chuck-artisan.md"  = "opencode.implement"
"agents/opencode/chuck-reviewer.md" = "opencode.review"
"agents/opencode/chuck-free.md"     = "opencode.free"
